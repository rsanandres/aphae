name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  headless-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GODOT_VERSION: "4.6"
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-stable-linux

      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          curl -sSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

      - name: Run the suite
        run: |
          set -o pipefail
          GODOT=~/godot-bin/godot bash tools/run_tests.sh 2>&1 | tee /tmp/suite.log

      - name: Publish output to the step summary on failure
        if: failure()
        # The job summary is readable without auth; the raw logs are not.
        run: |
          echo '### Suite output (last 120 lines)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -120 /tmp/suite.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # The soak: the same seed twice must give the same run, and a five
      # game-day run must not repeat itself more than the ceiling allows
      # (tools/run_soak.sh). Its numbers go to the summary on every run,
      # pass or fail, so a drift is visible before it trips the gate.
      - name: Soak (replay check and report)
        run: |
          set -o pipefail
          GODOT=~/godot-bin/godot bash tools/run_soak.sh 2>&1 | tee /tmp/soak.log

      - name: Publish the soak numbers to the step summary
        if: always()
        run: |
          if [ -f /tmp/soak.log ]; then
            echo '### Soak' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            sed -n '/== replay check/,$p' /tmp/soak.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the soak report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-report
          path: build/soak/report.json
          if-no-files-found: ignore
          retention-days: 7

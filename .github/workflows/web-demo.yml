name: web-demo

# Builds the no-threads web export and publishes it to GitHub Pages —
# a play-it-in-your-browser link that updates with main.
# No-threads sidesteps the SharedArrayBuffer/COOP/COEP problem entirely,
# so plain Pages hosting works with no service-worker shims.
#
# Deploy only what passed: this runs when the `tests` workflow finishes on
# main, and the job below goes ahead only if that run succeeded. It used to
# run on every push, beside the tests, so a red commit still went live.
# A manual dispatch remains as the deliberate way to publish without that
# gate (it builds whatever ref it is dispatched on).

on:
  workflow_run:
    workflows: ["tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    # `tests` also runs for pull requests; only a passing push to main
    # publishes. A failed or cancelled run publishes nothing.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # On the job, not the workflow: a run whose job is skipped (tests
    # failed) must not cancel a good deploy that is still in flight.
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GODOT_VERSION: "4.6"
      # A workflow_run event carries the default branch's tip as github.sha,
      # which may already be a newer commit than the one that was tested.
      # Build exactly the commit whose tests passed.
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Cache Godot + export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-export-${{ env.GODOT_VERSION }}-stable

      - name: Download Godot and templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          curl -sSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot
          curl -sSL -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Export Web
        run: |
          ~/godot-bin/godot --headless --path . --audio-driver Dummy --import || true
          mkdir -p build/web
          ~/godot-bin/godot --headless --path . --audio-driver Dummy \
            --export-release "Web" build/web/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      # itch.io mirror (Roadmap Track C): the same web build, pushed via
      # butler. Scaffolding until the owner creates the itch project and adds
      # the BUTLER_API_KEY repo secret — until then this step skips cleanly
      # and says so. Setup checklist: docs/ITCH.md.
      - name: Mirror to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: ${{ vars.ITCH_TARGET }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "BUTLER_API_KEY secret not set — skipping the itch.io mirror (see docs/ITCH.md to enable)"
            exit 0
          fi
          curl -sSL -o /tmp/butler.zip "https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default"
          unzip -q /tmp/butler.zip -d /tmp/butler
          chmod +x /tmp/butler/butler
          /tmp/butler/butler push build/web "${ITCH_TARGET:-rsanandres/aphae}:web" \
            --userversion "${DEPLOY_SHA::8}"
